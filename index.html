<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Episode Calendar</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink:       #0d0d0f;
    --paper:     #f5f0e8;
    --surface:   #ffffff;
    --accent:    #c8411a;
    --gold:      #b8860b;
    --muted:     #6b6560;
    --border:    #ddd8cc;
    --card-dim:  #e8e4dc;
    --summary:   #3a3530;
  }

  [data-theme="dark"] {
    --ink:       #f0ebe3;
    --paper:     #18181b;
    --surface:   #27272a;
    --accent:    #e0592a;
    --gold:      #d4a017;
    --muted:     #a09890;
    --border:    #3a3a3e;
    --card-dim:  #2a2a2e;
    --summary:   #c8c0b8;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Crimson Pro', Georgia, serif;
    min-height: 100vh;
    font-size: 18px;
    line-height: 1.5;
    transition: background 0.3s, color 0.3s;
  }

  /* ── LOADING ── */
  #loading {
    position: fixed; inset: 0;
    background: #0d0d0f;
    z-index: 999;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 1.5rem;
  }
  .loader-text {
    font-family: 'Cinzel', serif;
    font-size: 0.75rem; letter-spacing: 0.25em; text-transform: uppercase;
    color: rgba(245,240,232,0.6);
  }
  .loader-bar { width: 200px; height: 2px; background: rgba(255,255,255,0.1); position: relative; overflow: hidden; }
  .loader-bar::after {
    content: ''; position: absolute; left: -60%; top: 0; width: 60%; height: 100%;
    background: var(--accent); animation: sweep 1.2s ease-in-out infinite;
  }
  @keyframes sweep { to { left: 110%; } }
  #app { display: none; }

  /* ── HEADER ── */
  header {
    background: #0d0d0f;
    padding: 2.5rem 4rem 2rem;
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 1.5rem; flex-wrap: wrap;
    border-bottom: 3px solid var(--accent);
    position: relative; overflow: hidden;
  }
  header::after {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(ellipse at 100% 0%, rgba(200,65,26,0.15) 0%, transparent 60%);
    pointer-events: none;
  }
  .header-left h1 {
    font-family: 'Cinzel', serif;
    font-size: clamp(1.8rem, 4vw, 3rem); font-weight: 900;
    color: #f5f0e8; letter-spacing: 0.05em; line-height: 1;
  }
  .header-left p { font-style: italic; color: rgba(245,240,232,0.45); font-size: 0.95rem; margin-top: 0.4rem; }
  .updated {
    font-family: 'Cinzel', serif; font-size: 0.6rem; letter-spacing: 0.15em; text-transform: uppercase;
    color: rgba(245,240,232,0.25); margin-top: 0.5rem;
  }
  .header-right { position: relative; z-index: 1; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }

  /* ── SEARCH ── */
  .search-wrap { position: relative; display: flex; align-items: center; }
  .search-wrap svg { position: absolute; left: 0.75rem; color: rgba(245,240,232,0.4); pointer-events: none; width: 15px; height: 15px; }
  #search-input {
    font-family: 'Crimson Pro', serif; font-size: 1rem;
    padding: 0.5rem 2.25rem 0.5rem 2.25rem;
    background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.15);
    color: #f5f0e8; outline: none; width: 220px;
    transition: background 0.2s, border-color 0.2s, width 0.3s; border-radius: 2px;
  }
  #search-input::placeholder { color: rgba(245,240,232,0.35); }
  #search-input:focus { background: rgba(255,255,255,0.11); border-color: rgba(200,65,26,0.6); width: 280px; }
  #search-clear {
    position: absolute; right: 0.6rem; background: none; border: none;
    color: rgba(245,240,232,0.4); cursor: pointer; font-size: 1rem; line-height: 1; padding: 0.1rem;
    display: none; transition: color 0.2s;
  }
  #search-clear:hover { color: #f5f0e8; }
  #search-clear.visible { display: block; }

  /* ── THEME TOGGLE ── */
  .theme-toggle {
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
    border-radius: 2rem; padding: 0.35rem 0.5rem; display: flex; align-items: center; gap: 0.25rem;
  }
  .theme-toggle button {
    background: none; border: none; cursor: pointer; font-size: 1rem;
    padding: 0.2rem 0.45rem; border-radius: 1rem; color: rgba(255,255,255,0.4);
    transition: background 0.2s, color 0.2s; line-height: 1;
  }
  .theme-toggle button.active { background: rgba(255,255,255,0.15); color: #f5f0e8; }

  /* ── CONTENT ── */
  .content { padding: 3rem 4rem; max-width: 1000px; margin: 0 auto; }

  .empty-state {
    text-align: center; padding: 4rem 1rem; color: var(--muted); font-style: italic;
  }

  /* ── ANNOUNCED STRIP ── */
  .section-label {
    font-family: 'Cinzel', serif; font-size: 0.7rem; font-weight: 600;
    letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent);
    margin-bottom: 1rem; display: flex; align-items: center; gap: 0.75rem;
  }
  .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  .announced-strip {
    display: flex; gap: 1rem; overflow-x: auto; padding-bottom: 0.5rem; margin-bottom: 3rem;
  }
  .announced-card {
    flex: 0 0 auto; width: 150px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 3px;
    overflow: hidden;
  }
  .announced-poster { width: 100%; aspect-ratio: 2/3; object-fit: cover; background: var(--card-dim); display: block; }
  .announced-meta { padding: 0.6rem 0.7rem; }
  .announced-title { font-size: 0.92rem; font-weight: 600; line-height: 1.25; margin-bottom: 0.25rem; }
  .announced-season { font-size: 0.78rem; color: var(--gold); }
  .announced-date { font-size: 0.72rem; color: var(--muted); margin-top: 0.15rem; }

  /* ── CALENDAR ── */
  .day-group { margin-bottom: 2.25rem; }
  .day-heading {
    font-family: 'Cinzel', serif; font-size: 0.95rem; font-weight: 600;
    color: var(--ink); padding-bottom: 0.5rem; margin-bottom: 0.9rem;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: baseline; gap: 0.6rem;
  }
  .day-heading .rel { font-family: 'Crimson Pro', serif; font-style: italic; font-weight: 400; font-size: 0.85rem; color: var(--accent); }

  .episode-row {
    display: flex; align-items: center; gap: 1rem;
    padding: 0.65rem 0.25rem; border-bottom: 1px solid var(--border);
  }
  .episode-row:last-child { border-bottom: none; }
  .ep-poster { width: 42px; height: 63px; object-fit: cover; border-radius: 2px; background: var(--card-dim); flex-shrink: 0; }
  .ep-title { font-size: 1.05rem; flex: 1; }
  .ep-tag {
    font-family: 'Cinzel', serif; font-size: 0.7rem; letter-spacing: 0.08em;
    color: var(--muted); background: var(--card-dim); padding: 0.25rem 0.55rem; border-radius: 2px;
    white-space: nowrap;
  }

  #site-footer {
    text-align: center; padding: 2rem 1.5rem 3rem;
    font-size: 0.8rem; color: var(--muted); font-style: italic;
  }
  #site-footer a { color: var(--accent); text-decoration: none; }
  #site-footer a:hover { text-decoration: underline; }

  .new-badge {
    font-family: 'Cinzel', serif; font-size: 0.6rem; font-weight: 600; letter-spacing: 0.08em;
    color: #fff; background: var(--accent); padding: 0.1rem 0.4rem; border-radius: 2px;
    margin-left: 0.4rem; vertical-align: middle;
  }

  @media (max-width: 640px) {
    header { padding: 2rem 1.5rem 1.5rem; }
    .content { padding: 2rem 1.5rem; }
    #search-input { width: 150px; }
    #search-input:focus { width: 180px; }
  }
</style>
</head>
<body>

<div id="loading">
  <div class="loader-text">Loading calendar</div>
  <div class="loader-bar"></div>
</div>

<div id="app">
  <header>
    <div class="header-left">
      <h1 id="site-title">Episode Calendar</h1>
      <p id="header-sub">upcoming episodes</p>
      <div class="updated" id="updated-at"></div>
    </div>
    <div class="header-right">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="search-input" type="text" placeholder="Search shows…" oninput="handleSearch(this.value)">
        <button id="search-clear" onclick="clearSearch()">✕</button>
      </div>
      <div class="theme-toggle">
        <button id="theme-light" onclick="applyTheme('light')" title="Light">☀</button>
        <button id="theme-system" onclick="applyTheme('system')" title="System">◐</button>
        <button id="theme-dark" onclick="applyTheme('dark')" title="Dark">☾</button>
      </div>
    </div>
  </header>

  <div class="content">
    <div id="announced-section" style="display:none">
      <div class="section-label">Upcoming Seasons</div>
      <div class="announced-strip" id="announced-strip"></div>
    </div>

    <div id="calendar-container"></div>
    <div class="empty-state" id="empty-state" style="display:none">Nothing scheduled right now.</div>
  </div>

  <footer id="site-footer">Episode data provided by <a href="https://thetvdb.com" target="_blank" rel="noopener">TheTVDB.com</a></footer>
</div>

<script>
  const THEME_KEY = 'episode-calendar-theme';
  let cfg = {};
  let allUpcoming = [];
  let allNewSeasons = [];

  function applyTheme(mode) {
    localStorage.setItem(THEME_KEY, mode);
    const effective = mode === 'system'
      ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
      : mode;
    document.documentElement.setAttribute('data-theme', effective);
    document.querySelectorAll('.theme-toggle button').forEach(b => b.classList.remove('active'));
    document.getElementById(`theme-${mode}`)?.classList.add('active');
  }

  function initTheme(defaultTheme) {
    const saved = localStorage.getItem(THEME_KEY) || defaultTheme || 'system';
    applyTheme(saved);
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      if ((localStorage.getItem(THEME_KEY) || defaultTheme) === 'system') applyTheme('system');
    });
  }

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function fmtDayHeading(dateStr) {
    const d = new Date(dateStr + 'T00:00:00');
    const today = new Date(); today.setHours(0,0,0,0);
    const diffDays = Math.round((d - today) / 86400000);
    let rel = '';
    if (diffDays === 0) rel = 'Today';
    else if (diffDays === 1) rel = 'Tomorrow';
    else if (diffDays === -1) rel = 'Yesterday';
    const full = d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
    return { full, rel };
  }

  function posterHTML(url, cls) {
    return url
      ? `<img class="${cls}" src="${esc(url)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">`
      : `<div class="${cls}"></div>`;
  }

  function renderAnnounced(items) {
    const section = document.getElementById('announced-section');
    if (!items.length) { section.style.display = 'none'; return; }
    section.style.display = 'block';
    document.getElementById('announced-strip').innerHTML = items.map(s => `
      <div class="announced-card">
        ${posterHTML(s.poster, 'announced-poster')}
        <div class="announced-meta">
          <div class="announced-title" title="${esc(s.title)}">${esc(s.title)}${s.isNew ? '<span class="new-badge">New</span>' : ''}</div>
          <div class="announced-season">Season ${s.seasonNumber}</div>
          <div class="announced-date">${s.year ? `Expected ${esc(s.year)}` : 'Date TBA'}</div>
        </div>
      </div>`).join('');
  }

  function renderCalendar(items) {
    const container = document.getElementById('calendar-container');
    const empty = document.getElementById('empty-state');
    if (!items.length) { container.innerHTML = ''; empty.style.display = 'block'; return; }
    empty.style.display = 'none';

    const groups = {};
    for (const ep of items) {
      (groups[ep.airDate] = groups[ep.airDate] || []).push(ep);
    }
    const dates = Object.keys(groups).sort();

    container.innerHTML = dates.map(date => {
      const { full, rel } = fmtDayHeading(date);
      const rows = groups[date].map(ep => `
        <div class="episode-row">
          ${posterHTML(ep.poster, 'ep-poster')}
          <div class="ep-title">${esc(ep.title)}</div>
          <div class="ep-tag">S${String(ep.seasonNumber).padStart(2,'0')} · E${String(ep.episodeNumber).padStart(2,'0')}</div>
        </div>`).join('');
      return `
        <div class="day-group">
          <div class="day-heading">${full}${rel ? `<span class="rel">${rel}</span>` : ''}</div>
          ${rows}
        </div>`;
    }).join('');
  }

  function handleSearch(query) {
    const q = query.trim().toLowerCase();
    document.getElementById('search-clear').classList.toggle('visible', q.length > 0);
    if (!q) {
      renderAnnounced(allNewSeasons);
      renderCalendar(allUpcoming);
      return;
    }
    renderAnnounced(allNewSeasons.filter(s => s.title.toLowerCase().includes(q)));
    renderCalendar(allUpcoming.filter(e => e.title.toLowerCase().includes(q)));
  }

  function clearSearch() {
    const input = document.getElementById('search-input');
    input.value = '';
    handleSearch('');
    input.focus();
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') clearSearch();
    if ((e.key === 'k' && (e.ctrlKey || e.metaKey)) ||
        (e.key === '/' && document.activeElement.tagName !== 'INPUT')) {
      e.preventDefault();
      document.getElementById('search-input').focus();
    }
  });

  async function init() {
    try {
      const [cfgRes, dataRes] = await Promise.all([
        fetch('config.json?t=' + Date.now()),
        fetch('data.json?t='   + Date.now()),
      ]);
      cfg = await cfgRes.json();
      const data = await dataRes.json();

      allUpcoming   = data.upcomingEpisodes || [];
      allNewSeasons = data.upcomingSeasons  || [];

      initTheme(cfg.defaultTheme);
      document.title = cfg.siteTitle || 'Episode Calendar';
      document.getElementById('site-title').textContent = cfg.siteTitle || 'Episode Calendar';
      document.getElementById('header-sub').textContent =
        `${allUpcoming.length} episode${allUpcoming.length === 1 ? '' : 's'} on deck`;

      renderAnnounced(allNewSeasons);
      renderCalendar(allUpcoming);

      if (data.updatedAt) {
        const d = new Date(data.updatedAt);
        document.getElementById('updated-at').textContent =
          'Last updated ' + d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
      }
    } catch (e) {
      console.error('Failed to load data:', e);
      initTheme('system');
    }

    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = 'block';
  }

  document.getElementById('announced-strip').addEventListener('wheel', (e) => {
    if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return; // let native horizontal scroll/trackpad through
    e.preventDefault();
    e.currentTarget.scrollLeft += e.deltaY;
  }, { passive: false });

  init();
</script>
</body>
</html>
