name: Update Episode Calendar

on:
  schedule:
    - cron: '0 13 * * *'   # once daily — season announcements/air dates don't need 6hr freshness
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch episode data from Plex + TVDB
        run: node scripts/fetch-episodes.js
        env:
          PLEX_URL:             ${{ secrets.PLEX_URL }}
          PLEX_TOKEN:           ${{ secrets.PLEX_TOKEN }}
          TVDB_API_KEY:         ${{ secrets.TVDB_API_KEY }}
          OWNER_NAME:           ${{ vars.OWNER_NAME }}
          SITE_TITLE:           ${{ vars.SITE_TITLE }}
          DEFAULT_THEME:        ${{ vars.DEFAULT_THEME }}

      - name: Commit and push updated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Update episode calendar data'
          file_pattern: 'data.json config.json seasons-state.json'
